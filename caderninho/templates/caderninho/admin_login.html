{% extends 'caderninho/base.html' %}

{% block title %}Acesso Administrativo - Confeitaria Gourmet{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center py-8 sm:py-12">
  <div class="max-w-md w-full">
    
    <!-- Title / Logo -->
    <div class="text-center mb-8">
      <span class="inline-block bg-orange-100 text-orange-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-3">Painel Interno</span>
      <h1 class="text-2xl sm:text-3xl font-serif font-bold tracking-tight text-slate-900">Acesso Restrito</h1>
      <p class="text-sm text-slate-500 mt-2">Identifique-se com suas credenciais de administrador.</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white border border-slate-200/80 rounded-3xl shadow-sm p-6 sm:p-8">
      <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="bi bi-shield-lock-fill text-2xl"></i>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <div>
          <label for="id_username" class="block text-xs font-semibold text-slate-700 mb-1.5">Usuário</label>
          <input type="text" name="username" id="id_username" placeholder="Seu usuário..." required autofocus class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
        </div>

        <div>
          <label for="id_password" class="block text-xs font-semibold text-slate-700 mb-1.5">Senha</label>
          <input type="password" name="password" id="id_password" placeholder="Sua senha..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
        </div>

        <button type="submit" class="w-full mt-4 bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
          Entrar no Painel
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
